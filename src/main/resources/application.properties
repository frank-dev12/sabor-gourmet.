spring.application.name=sabor-gourmet-backend
server.port=8080

# --- MySQL / MariaDB ---
spring.datasource.url=jdbc:mysql://localhost:3306/sabor_gourmet?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:winter}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# El servidor local es MariaDB 11 (no MySQL 8):
# - Connector/J falla al leer sus metadatos (INFORMATION_SCHEMA.KEYWORDS.RESERVED no existe), así que el dialecto
#   se fija explícitamente y Hibernate no consulta esos metadatos al arrancar.
# - MySQLDialect genera "SELECT ... FOR UPDATE OF <alias>", que MariaDB rechaza; MariaDBDialect no.
#   Si se migra a MySQL 8, cambiar a org.hibernate.dialect.MySQLDialect.
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
# "update" es cómodo en desarrollo; en producción usar "validate" + migraciones (Flyway/Liquibase)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- CORS: orígenes de los frontends (React/Next en 3000, Vite en 5173), separados por coma ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
